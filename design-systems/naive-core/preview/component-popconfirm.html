<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Popconfirm</title>
  <link rel="stylesheet" href="../colors_and_type.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="../components.css" />
  <style>
    /* ── preview-page chrome (preview-only) ─────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bodyColor); color: var(--textColor1); font-family: var(--fontFamily); font-size: var(--fontSizeMedium); line-height: var(--lineHeightMedium); min-height: 100%; }
    body { padding: var(--spacer-32); }
    .pv-header { margin-bottom: var(--spacer-32); padding-bottom: var(--spacer-16); border-bottom: 1px solid var(--dividerColor); }
    .pv-header h1 { font-size: var(--heading-lg-font-size); font-weight: var(--heading-base-font-weight); margin-bottom: var(--spacer-4); }
    .pv-header p { color: var(--textColor2); font-size: var(--fontSizeSmall); }
    .pv-section { margin-bottom: var(--spacer-32); }
    .pv-section__title { font-size: var(--heading-sm-font-size); font-weight: var(--heading-base-font-weight); margin-bottom: var(--spacer-12); color: var(--textColor1); }
    .row { display: flex; gap: var(--spacer-12); align-items: center; flex-wrap: wrap; }
    .stack-12 { display: flex; flex-direction: column; gap: var(--spacer-12); }

    /* @component-css-start */
    /* ===== Popconfirm ===== */
.ds-popconfirm { display: flex; gap: var(--spacer-12); padding: var(--spacer-12) var(--spacer-16); border-radius: var(--borderRadiusMedium); border: 1px solid var(--borderColor); background: var(--actionColor); font-size: var(--fontSizeSmall); color: var(--textColor1); align-items: flex-start; }
.ds-popconfirm__icon { flex-shrink: 0; width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; }
.ds-popconfirm__title { font-weight: var(--fontWeightStrong); }
.ds-popconfirm__content { color: var(--textColor2); }
.ds-popconfirm--info { background: rgba(112, 192, 232, 0.08); border-color: rgba(112, 192, 232, 0.24); }
.ds-popconfirm--info .ds-popconfirm__icon { color: var(--infoColor); }
.ds-popconfirm--success { background: rgba(99, 226, 183, 0.08); border-color: rgba(99, 226, 183, 0.24); }
.ds-popconfirm--success .ds-popconfirm__icon { color: var(--successColor); }
.ds-popconfirm--warning { background: rgba(242, 201, 125, 0.08); border-color: rgba(242, 201, 125, 0.24); }
.ds-popconfirm--warning .ds-popconfirm__icon { color: var(--warningColor); }
.ds-popconfirm--error { background: rgba(232, 128, 128, 0.08); border-color: rgba(232, 128, 128, 0.24); }
.ds-popconfirm--error .ds-popconfirm__icon { color: var(--errorColor); }
    /* @component-css-end */
  </style>
</head>
<body>
  <header class="pv-header">
    <h1>Popconfirm</h1>
    <p>naive-ui popconfirm — renderCategory: feedback.</p>
  </header>
  <section class="pv-section">
    <div class="pv-section__title">Status variants</div>
    <div class="stack-12">
      <div class="ds-popconfirm ds-popconfirm--info">
        <span class="ds-popconfirm__icon">ℹ</span>
        <div><div class="ds-popconfirm__title">Info</div><div class="ds-popconfirm__content">Informational message.</div></div>
      </div>
      <div class="ds-popconfirm ds-popconfirm--success">
        <span class="ds-popconfirm__icon">✓</span>
        <div><div class="ds-popconfirm__title">Success</div><div class="ds-popconfirm__content">Operation completed.</div></div>
      </div>
      <div class="ds-popconfirm ds-popconfirm--warning">
        <span class="ds-popconfirm__icon">⚠</span>
        <div><div class="ds-popconfirm__title">Warning</div><div class="ds-popconfirm__content">Review before proceeding.</div></div>
      </div>
      <div class="ds-popconfirm ds-popconfirm--error">
        <span class="ds-popconfirm__icon">✕</span>
        <div><div class="ds-popconfirm__title">Error</div><div class="ds-popconfirm__content">Something went wrong.</div></div>
      </div>
    </div>
  </section>
</body>
</html>
