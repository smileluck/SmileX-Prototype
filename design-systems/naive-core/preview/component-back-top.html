<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Back Top</title>
  <link rel="stylesheet" href="../colors_and_type.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="../components.css" />
  <style>
    /* ── preview-page chrome (preview-only) ─────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bodyColor); color: var(--textColor1); font-family: var(--fontFamily); font-size: var(--fontSizeMedium); line-height: var(--lineHeightMedium); min-height: 100%; }
    body { padding: var(--spacer-32); }
    .pv-header { margin-bottom: var(--spacer-32); padding-bottom: var(--spacer-16); border-bottom: 1px solid var(--dividerColor); }
    .pv-header h1 { font-size: var(--heading-lg-font-size); font-weight: var(--heading-base-font-weight); margin-bottom: var(--spacer-4); }
    .pv-header p { color: var(--textColor2); font-size: var(--fontSizeSmall); }
    .pv-section { margin-bottom: var(--spacer-32); }
    .pv-section__title { font-size: var(--heading-sm-font-size); font-weight: var(--heading-base-font-weight); margin-bottom: var(--spacer-12); color: var(--textColor1); }
    .row { display: flex; gap: var(--spacer-12); align-items: center; flex-wrap: wrap; }
    .stack-12 { display: flex; flex-direction: column; gap: var(--spacer-12); }

    /* @component-css-start */
    /* ===== Back Top ===== */
.ds-back-top { display: flex; gap: var(--spacer-4); font-size: var(--fontSizeSmall); }
.ds-back-top--horizontal { flex-direction: row; border-bottom: 1px solid var(--dividerColor); }
.ds-back-top--vertical { flex-direction: column; width: 200px; background: var(--cardColor); border: 1px solid var(--borderColor); border-radius: var(--borderRadiusMedium); padding: var(--spacer-4); }
.ds-back-top__item { padding: var(--spacer-8) var(--spacer-12); cursor: pointer; color: var(--textColor2); border-radius: var(--borderRadiusSmall); transition: background 0.12s, color 0.12s; user-select: none; position: relative; }
.ds-back-top__item:hover { background: var(--hoverColor); color: var(--textColor1); }
.ds-back-top__item--active { color: var(--primaryColor); font-weight: var(--fontWeightStrong); }
.ds-back-top--horizontal .ds-back-top__item--active::after { content: ""; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: var(--primaryColor); }
.ds-back-top--vertical .ds-back-top__item--active { background: var(--actionColor); }
    /* @component-css-end */
  </style>
</head>
<body>
  <header class="pv-header">
    <h1>Back Top</h1>
    <p>naive-ui back-top — renderCategory: navigation.</p>
  </header>
  <section class="pv-section">
    <div class="pv-section__title">Horizontal</div>
    <nav class="ds-back-top ds-back-top--horizontal">
      <div class="ds-back-top__item ds-back-top__item--active">Home</div>
      <div class="ds-back-top__item">Products</div>
      <div class="ds-back-top__item">Pricing</div>
      <div class="ds-back-top__item">Docs</div>
    </nav>
  </section>
  <section class="pv-section">
    <div class="pv-section__title">Vertical</div>
    <nav class="ds-back-top ds-back-top--vertical">
      <div class="ds-back-top__item ds-back-top__item--active">Dashboard</div>
      <div class="ds-back-top__item">Projects</div>
      <div class="ds-back-top__item">Tasks</div>
      <div class="ds-back-top__item">Settings</div>
    </nav>
  </section>
</body>
</html>
