<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Color Picker</title>
  <link rel="stylesheet" href="../colors_and_type.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="../components.css" />
  <style>
    /* ── preview-page chrome (preview-only) ─────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bodyColor); color: var(--textColor1); font-family: var(--fontFamily); font-size: var(--fontSizeMedium); line-height: var(--lineHeightMedium); min-height: 100%; }
    body { padding: var(--spacer-32); }
    .pv-header { margin-bottom: var(--spacer-32); padding-bottom: var(--spacer-16); border-bottom: 1px solid var(--dividerColor); }
    .pv-header h1 { font-size: var(--heading-lg-font-size); font-weight: var(--heading-base-font-weight); margin-bottom: var(--spacer-4); }
    .pv-header p { color: var(--textColor2); font-size: var(--fontSizeSmall); }
    .pv-section { margin-bottom: var(--spacer-32); }
    .pv-section__title { font-size: var(--heading-sm-font-size); font-weight: var(--heading-base-font-weight); margin-bottom: var(--spacer-12); color: var(--textColor1); }
    .row { display: flex; gap: var(--spacer-12); align-items: center; flex-wrap: wrap; }
    .stack-12 { display: flex; flex-direction: column; gap: var(--spacer-12); }

    /* @component-css-start */
    /* ===== Color Picker ===== */
.ds-color-picker { display: inline-flex; align-items: center; gap: var(--spacer-8); }
.ds-color-picker__swatch { width: 28px; height: 28px; border-radius: var(--borderRadiusSmall); border: 1px solid var(--borderColor); }
.ds-color-picker__input { width: 100px; height: var(--heightSmall); padding: 0 var(--spacer-8); background: var(--inputColor); border: 1px solid var(--borderColor); border-radius: var(--borderRadiusSmall); color: var(--textColor1); font-family: var(--fontFamilyMono); font-size: var(--fontSizeSmall); }
.ds-color-picker__presets { display: flex; gap: var(--spacer-4); }
.ds-color-picker__preset { width: 20px; height: 20px; border-radius: var(--borderRadiusSmall); border: 1px solid var(--borderColor); cursor: pointer; }
    /* @component-css-end */
  </style>
</head>
<body>
  <header class="pv-header">
    <h1>Color Picker</h1>
    <p>naive-ui color-picker — renderCategory: special.</p>
  </header>
  <section class="pv-section">
    <div class="pv-section__title">Color picker</div>
    <div class="ds-color-picker">
      <div class="ds-color-picker__swatch" style="background: var(--primaryColor);"></div>
      <input class="ds-color-picker__input" value="#63e2b7" />
      <div class="ds-color-picker__presets">
        <button class="ds-color-picker__preset" style="background: #63e2b7"></button>
        <button class="ds-color-picker__preset" style="background: #70c0e8"></button>
        <button class="ds-color-picker__preset" style="background: #f2c97d"></button>
        <button class="ds-color-picker__preset" style="background: #e88080"></button>
      </div>
    </div>
  </section>
</body>
</html>
