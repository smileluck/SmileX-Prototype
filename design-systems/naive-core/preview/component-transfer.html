<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Transfer</title>
  <link rel="stylesheet" href="../colors_and_type.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="../components.css" />
  <style>
    /* ── preview-page chrome (preview-only) ─────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bodyColor); color: var(--textColor1); font-family: var(--fontFamily); font-size: var(--fontSizeMedium); line-height: var(--lineHeightMedium); min-height: 100%; }
    body { padding: var(--spacer-32); }
    .pv-header { margin-bottom: var(--spacer-32); padding-bottom: var(--spacer-16); border-bottom: 1px solid var(--dividerColor); }
    .pv-header h1 { font-size: var(--heading-lg-font-size); font-weight: var(--heading-base-font-weight); margin-bottom: var(--spacer-4); }
    .pv-header p { color: var(--textColor2); font-size: var(--fontSizeSmall); }
    .pv-section { margin-bottom: var(--spacer-32); }
    .pv-section__title { font-size: var(--heading-sm-font-size); font-weight: var(--heading-base-font-weight); margin-bottom: var(--spacer-12); color: var(--textColor1); }
    .row { display: flex; gap: var(--spacer-12); align-items: center; flex-wrap: wrap; }
    .stack-12 { display: flex; flex-direction: column; gap: var(--spacer-12); }

    /* @component-css-start */
    /* ===== Transfer ===== */
.ds-transfer { display: flex; gap: var(--spacer-12); align-items: center; }
.ds-transfer__panel { width: 220px; background: var(--cardColor); border: 1px solid var(--borderColor); border-radius: var(--borderRadiusMedium); overflow: hidden; }
.ds-transfer__header { padding: var(--spacer-8) var(--spacer-12); background: var(--tableHeaderColor); font-size: var(--fontSizeSmall); font-weight: var(--fontWeightStrong); border-bottom: 1px solid var(--dividerColor); }
.ds-transfer__item { padding: var(--spacer-8) var(--spacer-12); font-size: var(--fontSizeSmall); color: var(--textColor1); border-bottom: 1px solid var(--dividerColor); }
.ds-transfer__item:hover { background: var(--hoverColor); }
.ds-transfer__ops { display: flex; flex-direction: column; gap: var(--spacer-8); }
    /* @component-css-end */
  </style>
</head>
<body>
  <header class="pv-header">
    <h1>Transfer</h1>
    <p>naive-ui transfer — renderCategory: special.</p>
  </header>
  <section class="pv-section">
    <div class="pv-section__title">Transfer</div>
    <div class="ds-transfer">
      <div class="ds-transfer__panel">
        <div class="ds-transfer__header">Source (5)</div>
        <div class="ds-transfer__item">Item 1</div><div class="ds-transfer__item">Item 2</div><div class="ds-transfer__item">Item 3</div><div class="ds-transfer__item">Item 4</div><div class="ds-transfer__item">Item 5</div>
      </div>
      <div class="ds-transfer__ops">
        <button class="ds-btn ds-btn--default ds-btn--small">→</button>
        <button class="ds-btn ds-btn--default ds-btn--small">←</button>
      </div>
      <div class="ds-transfer__panel">
        <div class="ds-transfer__header">Target (2)</div>
        <div class="ds-transfer__item">Chosen 1</div><div class="ds-transfer__item">Chosen 2</div>
      </div>
    </div>
  </section>
</body>
</html>
