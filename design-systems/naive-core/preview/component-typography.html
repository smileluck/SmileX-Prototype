<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Typography</title>
  <link rel="stylesheet" href="../colors_and_type.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="../components.css" />
  <style>
    /* ── preview-page chrome (preview-only) ─────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bodyColor); color: var(--textColor1); font-family: var(--fontFamily); font-size: var(--fontSizeMedium); line-height: var(--lineHeightMedium); min-height: 100%; }
    body { padding: var(--spacer-32); }
    .pv-header { margin-bottom: var(--spacer-32); padding-bottom: var(--spacer-16); border-bottom: 1px solid var(--dividerColor); }
    .pv-header h1 { font-size: var(--heading-lg-font-size); font-weight: var(--heading-base-font-weight); margin-bottom: var(--spacer-4); }
    .pv-header p { color: var(--textColor2); font-size: var(--fontSizeSmall); }
    .pv-section { margin-bottom: var(--spacer-32); }
    .pv-section__title { font-size: var(--heading-sm-font-size); font-weight: var(--heading-base-font-weight); margin-bottom: var(--spacer-12); color: var(--textColor1); }
    .row { display: flex; gap: var(--spacer-12); align-items: center; flex-wrap: wrap; }
    .stack-12 { display: flex; flex-direction: column; gap: var(--spacer-12); }

    /* @component-css-start */
    /* ===== Typography ===== */
.ds-typo h1 { font-size: var(--heading-3xl-font-size); font-weight: 600; margin-bottom: var(--spacer-12); color: var(--textColor1); }
.ds-typo h2 { font-size: var(--heading-2xl-font-size); font-weight: 600; margin-bottom: var(--spacer-12); color: var(--textColor1); }
.ds-typo h3 { font-size: var(--heading-xl-font-size); font-weight: 600; margin-bottom: var(--spacer-8); color: var(--textColor1); }
.ds-typo h4 { font-size: var(--heading-lg-font-size); font-weight: 600; margin-bottom: var(--spacer-8); color: var(--textColor1); }
.ds-typo p { margin-bottom: var(--spacer-12); color: var(--textColor2); line-height: var(--lineHeightMedium); }
.ds-typo ul { margin-bottom: var(--spacer-12); padding-left: var(--spacer-24); color: var(--textColor2); }
.ds-typo blockquote { padding: var(--spacer-8) var(--spacer-16); border-left: 3px solid var(--primaryColor); background: var(--actionColor); color: var(--textColor2); margin-bottom: var(--spacer-12); }
.ds-typo a { color: var(--primaryColor); }
    /* @component-css-end */
  </style>
</head>
<body>
  <header class="pv-header">
    <h1>Typography</h1>
    <p>naive-ui typography — renderCategory: special.</p>
  </header>
  <section class="pv-section">
    <div class="ds-typo">
      <h1>h1. Heading</h1>
      <h2>h2. Heading</h2>
      <h3>h3. Heading</h3>
      <h4>h4. Heading</h4>
      <p>Body paragraph with <strong>strong</strong>, <em>em</em>, and a <a href="#">link</a>.</p>
      <ul><li>List item one</li><li>List item two</li></ul>
      <blockquote>Blockquote — highlighted callout.</blockquote>
    </div>
  </section>
</body>
</html>
