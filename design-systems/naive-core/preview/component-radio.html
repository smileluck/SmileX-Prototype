<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radio</title>
  <link rel="stylesheet" href="../colors_and_type.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="../components.css" />
  <style>
    /* ── preview-page chrome (preview-only) ─────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bodyColor); color: var(--textColor1); font-family: var(--fontFamily); font-size: var(--fontSizeMedium); line-height: var(--lineHeightMedium); min-height: 100%; }
    body { padding: var(--spacer-32); }
    .pv-header { margin-bottom: var(--spacer-32); padding-bottom: var(--spacer-16); border-bottom: 1px solid var(--dividerColor); }
    .pv-header h1 { font-size: var(--heading-lg-font-size); font-weight: var(--heading-base-font-weight); margin-bottom: var(--spacer-4); }
    .pv-header p { color: var(--textColor2); font-size: var(--fontSizeSmall); }
    .pv-section { margin-bottom: var(--spacer-32); }
    .pv-section__title { font-size: var(--heading-sm-font-size); font-weight: var(--heading-base-font-weight); margin-bottom: var(--spacer-12); color: var(--textColor1); }
    .row { display: flex; gap: var(--spacer-12); align-items: center; flex-wrap: wrap; }
    .stack-12 { display: flex; flex-direction: column; gap: var(--spacer-12); }

    /* @component-css-start */
    /* ===== Radio ===== */
.ds-radio { display: inline-flex; align-items: center; gap: var(--spacer-8); cursor: pointer; user-select: none; font-size: var(--fontSizeSmall); color: var(--textColor1); }
.ds-radio__dot { width: 16px; height: 16px; border: 1.5px solid var(--borderColor); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; transition: border-color 0.12s; }
.ds-radio--checked .ds-radio__dot { border-color: var(--primaryColor); }
.ds-radio--checked .ds-radio__dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--primaryColor); }
.ds-radio-group { display: flex; gap: var(--spacer-16); }
    /* @component-css-end */
  </style>
</head>
<body>
  <header class="pv-header">
    <h1>Radio</h1>
    <p>naive-ui radio — renderCategory: special.</p>
  </header>
  <section class="pv-section">
    <div class="pv-section__title">Radio group</div>
    <div class="ds-radio-group">
      <span class="ds-radio ds-radio--checked"><span class="ds-radio__dot"></span>Option A</span>
      <span class="ds-radio"><span class="ds-radio__dot"></span>Option B</span>
      <span class="ds-radio"><span class="ds-radio__dot"></span>Option C</span>
    </div>
  </section>
</body>
</html>
