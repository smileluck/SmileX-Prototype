<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Button Group</title>
  <link rel="stylesheet" href="../colors_and_type.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="../components.css" />
  <style>
    /* ── preview-page chrome (preview-only) ─────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bodyColor); color: var(--textColor1); font-family: var(--fontFamily); font-size: var(--fontSizeMedium); line-height: var(--lineHeightMedium); min-height: 100%; }
    body { padding: var(--spacer-32); }
    .pv-header { margin-bottom: var(--spacer-32); padding-bottom: var(--spacer-16); border-bottom: 1px solid var(--dividerColor); }
    .pv-header h1 { font-size: var(--heading-lg-font-size); font-weight: var(--heading-base-font-weight); margin-bottom: var(--spacer-4); }
    .pv-header p { color: var(--textColor2); font-size: var(--fontSizeSmall); }
    .pv-section { margin-bottom: var(--spacer-32); }
    .pv-section__title { font-size: var(--heading-sm-font-size); font-weight: var(--heading-base-font-weight); margin-bottom: var(--spacer-12); color: var(--textColor1); }
    .row { display: flex; gap: var(--spacer-12); align-items: center; flex-wrap: wrap; }
    .stack-12 { display: flex; flex-direction: column; gap: var(--spacer-12); }

    /* @component-css-start */
    /* ===== Button Group ===== */
.ds-button-group { display: inline-flex; align-items: center; justify-content: center; gap: var(--spacer-4); padding: 0 var(--spacer-12); height: var(--heightMedium); border-radius: var(--borderRadiusMedium); border: 1px solid transparent; cursor: pointer; font-family: var(--fontFamily); font-size: var(--fontSizeMedium); font-weight: var(--fontWeightStrong); transition: background 0.12s, color 0.12s, border-color 0.12s; user-select: none; }
.ds-button-group--tiny { height: var(--heightTiny); padding: 0 var(--spacer-8); font-size: var(--fontSizeTiny); border-radius: var(--borderRadiusSmall); }
.ds-button-group--small { height: var(--heightSmall); font-size: var(--fontSizeSmall); border-radius: var(--borderRadiusSmall); }
.ds-button-group--medium { height: var(--heightMedium); font-size: var(--fontSizeMedium); }
.ds-button-group--large { height: var(--heightLarge); font-size: var(--fontSizeLarge); padding: 0 var(--spacer-16); }
.ds-button-group--primary { background: var(--primaryColor); color: var(--invertedColor); }
.ds-button-group--primary:hover { background: var(--primaryColorHover); }
.ds-button-group--default { background: var(--buttonColor2); color: var(--textColor1); border-color: var(--borderColor); }
.ds-button-group--tertiary { background: transparent; color: var(--textColor1); }
.ds-button-group--tertiary:hover { background: var(--hoverColor); }
.ds-button-group--info { background: var(--infoColor); color: var(--invertedColor); }
.ds-button-group--success { background: var(--successColor); color: var(--invertedColor); }
.ds-button-group--warning { background: var(--warningColor); color: var(--invertedColor); }
.ds-button-group--error { background: var(--errorColor); color: var(--invertedColor); }
.ds-button-group[disabled] { opacity: 0.5; cursor: not-allowed; }
    /* @component-css-end */
  </style>
</head>
<body>
  <header class="pv-header">
    <h1>Button Group</h1>
    <p>naive-ui button-group — renderCategory: button.</p>
  </header>
  <section class="pv-section">
    <div class="pv-section__title">Types</div>
    <div class="row">
      <button class="ds-button-group ds-button-group--primary ds-button-group--medium">Primary</button>
      <button class="ds-button-group ds-button-group--default ds-button-group--medium">Default</button>
      <button class="ds-button-group ds-button-group--tertiary ds-button-group--medium">Tertiary</button>
      <button class="ds-button-group ds-button-group--info ds-button-group--medium">Info</button>
      <button class="ds-button-group ds-button-group--success ds-button-group--medium">Success</button>
      <button class="ds-button-group ds-button-group--warning ds-button-group--medium">Warning</button>
      <button class="ds-button-group ds-button-group--error ds-button-group--medium">Error</button>
    </div>
  </section>
  <section class="pv-section">
    <div class="pv-section__title">Sizes</div>
    <div class="row">
      <button class="ds-button-group ds-button-group--primary ds-button-group--tiny">Tiny</button>
      <button class="ds-button-group ds-button-group--primary ds-button-group--small">Small</button>
      <button class="ds-button-group ds-button-group--primary ds-button-group--medium">Medium</button>
      <button class="ds-button-group ds-button-group--primary ds-button-group--large">Large</button>
    </div>
  </section>
  <section class="pv-section">
    <div class="pv-section__title">States</div>
    <div class="row">
      <button class="ds-button-group ds-button-group--primary ds-button-group--medium">Default</button>
      <button class="ds-button-group ds-button-group--primary ds-button-group--medium" disabled>Disabled</button>
    </div>
  </section>
</body>
</html>
