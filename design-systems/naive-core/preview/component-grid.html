<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Grid</title>
  <link rel="stylesheet" href="../colors_and_type.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="../components.css" />
  <style>
    /* ── preview-page chrome (preview-only) ─────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bodyColor); color: var(--textColor1); font-family: var(--fontFamily); font-size: var(--fontSizeMedium); line-height: var(--lineHeightMedium); min-height: 100%; }
    body { padding: var(--spacer-32); }
    .pv-header { margin-bottom: var(--spacer-32); padding-bottom: var(--spacer-16); border-bottom: 1px solid var(--dividerColor); }
    .pv-header h1 { font-size: var(--heading-lg-font-size); font-weight: var(--heading-base-font-weight); margin-bottom: var(--spacer-4); }
    .pv-header p { color: var(--textColor2); font-size: var(--fontSizeSmall); }
    .pv-section { margin-bottom: var(--spacer-32); }
    .pv-section__title { font-size: var(--heading-sm-font-size); font-weight: var(--heading-base-font-weight); margin-bottom: var(--spacer-12); color: var(--textColor1); }
    .row { display: flex; gap: var(--spacer-12); align-items: center; flex-wrap: wrap; }
    .stack-12 { display: flex; flex-direction: column; gap: var(--spacer-12); }

    /* @component-css-start */
    /* ===== Grid ===== */
.ds-grid { display: flex; gap: var(--spacer-12); }
.ds-grid--vertical { flex-direction: column; }
.ds-grid--2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--spacer-16); }
.ds-grid--3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--spacer-16); }
.ds-grid__cell { padding: var(--spacer-16); background: var(--cardColor); border: 1px solid var(--borderColor); border-radius: var(--borderRadiusMedium); color: var(--textColor1); font-size: var(--fontSizeSmall); }
.ds-grid--justify-between { justify-content: space-between; }
.ds-grid--align-center { align-items: center; }
    /* @component-css-end */
  </style>
</head>
<body>
  <header class="pv-header">
    <h1>Grid</h1>
    <p>naive-ui grid — renderCategory: layout.</p>
  </header>
  <section class="pv-section">
    <div class="pv-section__title">Grid 3 columns</div>
    <div class="ds-grid ds-grid--3">
      <div class="ds-grid__cell">Cell 1</div>
      <div class="ds-grid__cell">Cell 2</div>
      <div class="ds-grid__cell">Cell 3</div>
    </div>
  </section>
  <section class="pv-section">
    <div class="pv-section__title">Flex justify-between</div>
    <div class="ds-grid ds-grid--justify-between ds-grid--align-center">
      <span>Left</span><span>Right</span>
    </div>
  </section>
  <section class="pv-section">
    <div class="pv-section__title">Vertical stack</div>
    <div class="ds-grid ds-grid--vertical">
      <div class="ds-grid__cell">Item 1</div>
      <div class="ds-grid__cell">Item 2</div>
    </div>
  </section>
</body>
</html>
