<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stat card</title>
  <link rel="stylesheet" href="../colors_and_type.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="../components.css" />
  <style>
    /* ── preview-page chrome (reset + body + .pv-*, preview-only) ───────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg-base-default);
      color: var(--text-default);
      font-family: var(--body-base-font-family);
      font-size: var(--body-base-font-size);
      line-height: var(--body-base-line-height);
      font-weight: var(--body-base-font-weight);
      min-height: 100%;
      overflow-x: hidden;
      max-width: 100%;
    }
    body { padding: var(--spacer-32); }
    img, svg, video, canvas { max-width: 100%; }
    a { color: var(--text-default); text-decoration: none; }
    a:hover { color: var(--text-default-hover); }
    hr { border: 0; border-top: 1px solid var(--border-neutral-l1); margin: var(--spacer-24) 0; }
    .pv-header { margin-bottom: var(--spacer-32); padding-bottom: var(--spacer-16); border-bottom: 1px solid var(--border-neutral-l1); }
    .pv-header h1 { font-size: var(--heading-lg-font-size); line-height: var(--heading-lg-line-height); font-weight: var(--heading-lg-font-weight); margin-bottom: var(--spacer-4); }
    .pv-header p { color: var(--text-secondary); font-size: var(--body-sm-font-size); }
    .pv-section { margin-bottom: var(--spacer-32); }
    .pv-section__title { font-size: var(--heading-xs-font-size); font-weight: var(--heading-xs-font-weight); margin-bottom: var(--spacer-12); color: var(--text-default); }
    .pv-section__sub { font-size: var(--body-xs-font-size); color: var(--text-tertiary); margin-bottom: var(--spacer-12); }

    /* @component-css-start */
    /* ===== Stat card ===== */
    .ds-statcard {
      display: flex;
      flex-direction: column;
      gap: var(--spacer-8);
      padding: var(--spacer-16);
      background: var(--bg-base-secondary);
      border: 1px solid var(--border-neutral-l1);
      border-radius: var(--radius-10);
      min-width: 200px;
    }
    .ds-statcard__label {
      font-size: var(--body-xs-font-size);
      line-height: var(--body-xs-line-height);
      font-weight: var(--font-weight-medium);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
    }
    .ds-statcard__value {
      font-family: var(--code-editor-font-family);
      font-variant-numeric: tabular-nums;
      font-size: var(--heading-lg-font-size);
      line-height: var(--heading-lg-line-height);
      font-weight: var(--font-weight-strong);
      color: var(--text-default);
    }
    .ds-statcard__delta {
      display: inline-flex;
      align-items: center;
      gap: var(--spacer-4);
      font-size: var(--body-sm-font-size);
      line-height: var(--body-sm-line-height);
      font-weight: var(--font-weight-medium);
      font-variant-numeric: tabular-nums;
    }
    .ds-statcard__delta.is-up { color: var(--status-success-default); }
    .ds-statcard__delta.is-down { color: var(--status-error-default); }
    .ds-statcard__delta .ds-statcard__caption {
      color: var(--text-tertiary);
      font-weight: var(--font-weight-default);
    }
    .ds-statcard__grid {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacer-16);
    }
    /* @component-css-end */
  </style>
</head>
<body>
  <div class="pv-header">
    <h1>Stat card</h1>
    <p>KPI 指标卡：大写小标签 + 等宽大数字 + 涨跌 delta。</p>
  </div>
  <div class="pv-section">
    <div class="pv-section__title">KPI grid</div>
    <div class="ds-statcard__grid">
      <div class="ds-statcard">
        <span class="ds-statcard__label">Monthly revenue</span>
        <span class="ds-statcard__value">$84,290</span>
        <span class="ds-statcard__delta is-up">
          <img src="../assets/icons/trending-up.svg" width="16" height="16" alt="trending-up" class="icon" />
          +12.4%
          <span class="ds-statcard__caption">vs last month</span>
        </span>
      </div>
      <div class="ds-statcard">
        <span class="ds-statcard__label">Active users</span>
        <span class="ds-statcard__value">28,412</span>
        <span class="ds-statcard__delta is-up">
          <img src="../assets/icons/arrow-up.svg" width="16" height="16" alt="arrow-up" class="icon" />
          +3.1%
          <span class="ds-statcard__caption">7-day</span>
        </span>
      </div>
      <div class="ds-statcard">
        <span class="ds-statcard__label">Churn rate</span>
        <span class="ds-statcard__value">2.7%</span>
        <span class="ds-statcard__delta is-down">
          <img src="../assets/icons/trending-down.svg" width="16" height="16" alt="trending-down" class="icon" />
          -0.4%
          <span class="ds-statcard__caption">vs last month</span>
        </span>
      </div>
      <div class="ds-statcard">
        <span class="ds-statcard__label">Avg. response time</span>
        <span class="ds-statcard__value">312ms</span>
        <span class="ds-statcard__delta is-down">
          <img src="../assets/icons/arrow-down.svg" width="16" height="16" alt="arrow-down" class="icon" />
          -18ms
          <span class="ds-statcard__caption">faster</span>
        </span>
      </div>
    </div>
  </div>
</body>
</html>
